<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meta</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <h1>Meta</h1>
  <h2>Summary</h2>

  <div class="commit-slider-container">
    <div class="commit-slider-row">
      <label for="commit-progress">Show commits until:</label>
      <input type="range" id="commit-progress" min="0" max="100" value="0" />
    </div>
    <time id="commit-time" class="commit-time">00:00</time>
  </div>

  <div id="stats"></div>

  <h2>Commits by date</h2>

  <div id="scrolly-1">
    <div id="scatter-story">
      <p><b>Scroll to view the development of my website</b></p>
    </div>

    <div id="scatter-plot">
      <div id="chart"></div>

      <dl id="commit-tooltip" class="info tooltip" hidden>
        <dt>Commit</dt>
        <dd>
          <a href="" id="commit-link" target="_blank"></a>
        </dd>

        <dt>Date</dt>
        <dd id="commit-date"></dd>

        <dt>Time</dt>
        <dd id="commit-time"></dd>

        <dt>Author</dt>
        <dd id="commit-author"></dd>

        <dt>Lines Edited</dt>
        <dd id="commit-lines"></dd>
      </dl>

      <p id="selection-count">No commits selected</p>
      <dl id="language-breakdown" class="stats"></dl>
    </div>
  </div>

  <dl id="files"></dl>

  <script type="module" src="../global.js"></script>
  <script src="main.js" type="module"></script>
</body>
</html>
